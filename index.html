<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0d12">
<title>MediaVault — Creative Asset Library</title>
<meta name="description" content="Browse sound effects, background music and B-roll footage.">
<style>
:root{color-scheme:dark;--bg:#0b0d12;--panel:#151a24;--line:#293142;--text:#f4f5fa;--muted:#9aa4b5;--purple:#ad96ff;--mint:#70e1c1}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -10%,#292044 0,transparent 38%),var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif}
.wrap{max-width:1180px;margin:auto;padding:30px 24px 65px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:62px}.brand{display:flex;gap:12px;align-items:center;font-weight:800;font-size:19px}.logo{width:39px;height:39px;border-radius:13px;background:linear-gradient(135deg,var(--purple),var(--mint));display:grid;place-items:center;color:#10121a;font-size:21px}.public{font-size:12px;color:var(--muted);border:1px solid var(--line);padding:7px 11px;border-radius:30px}
.hero{max-width:720px}.eyebrow{color:var(--mint);font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase}.hero h1{font-size:clamp(42px,7vw,72px);line-height:1.02;letter-spacing:-3px;margin:14px 0 18px}.hero h1 span{color:var(--purple)}.hero p{color:var(--muted);font-size:16px;max-width:570px;margin:0}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:38px 0 32px}.search{flex:1;min-width:220px;max-width:420px}.search input{width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);outline:none}.search input:focus{border-color:var(--purple)}.filters{display:flex;gap:8px;flex-wrap:wrap}.filter{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:10px 13px;border-radius:10px}.filter.active{background:#ad96ff20;border-color:var(--purple);color:#e3d9ff}
.section{margin:38px 0 48px}.section-head{display:flex;align-items:center;gap:12px;margin-bottom:17px}.section-icon{width:39px;height:39px;border-radius:12px;background:#ad96ff1b;color:var(--purple);display:grid;place-items:center;font-size:19px}.section-head h2{font-size:21px;margin:0}.count{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:3px 9px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:15px}.card{border:1px solid var(--line);background:linear-gradient(145deg,#181e2a,#11151e);border-radius:16px;overflow:hidden;min-width:0}.visual{height:145px;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#39305c,#191b2b 70%)}.visual.music{background:radial-gradient(circle at 50% 40%,#174b48,#17252d 70%)}.visual.video{background:#181b24}.visual video{width:100%;height:100%;object-fit:cover}.glyph{font-size:44px}.card-body{padding:15px}.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.card h3{font-size:15px;margin:0 0 6px;overflow-wrap:anywhere}.tag{font-size:10px;letter-spacing:1px;color:var(--mint);background:#70e1c11a;padding:4px 7px;border-radius:6px;white-space:nowrap}.filename{font-size:12px;color:var(--muted);margin:0 0 10px;overflow-wrap:anywhere}.player{display:block;width:100%;height:37px;margin-top:10px}.empty{border:1px dashed #343d4e;border-radius:14px;padding:27px;text-align:center;color:var(--muted);grid-column:1/-1}.empty strong{display:block;color:var(--text);margin-bottom:5px}.error{color:#ff9eaa}
footer{border-top:1px solid var(--line);padding-top:22px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media(max-width:600px){.wrap{padding:20px 16px 45px}header{margin-bottom:45px}.hero h1{letter-spacing:-2px}.toolbar{align-items:stretch}.search{max-width:none}.filters{width:100%}.filter{flex:1}}
</style>
</head>
<body><div class="wrap">
<header><div class="brand"><div class="logo">✳</div>MediaVault</div><div class="public">PUBLIC LIBRARY</div></header>
<main>
<section class="hero"><div class="eyebrow">The creator's library</div><h1>Every sound.<br>Every frame. <span>Organised.</span></h1><p>A curated collection of sound effects, background music and B-roll footage. Browse, listen and preview everything in one place.</p></section>
<div class="toolbar"><label class="search"><input id="search" type="search" placeholder="Search media files…" aria-label="Search media files"></label><div class="filters" id="filters"><button class="filter active" data-filter="all">All media</button><button class="filter" data-filter="sounds">Sound effects</button><button class="filter" data-filter="music">Background music</button><button class="filter" data-filter="broll">B-roll</button></div></div>
<div id="sections"><div class="empty">Loading the library…</div></div>
</main><footer><span>MediaVault · Personal media library</span><span id="total">Loading…</span></footer>
</div>
<script>
const OWNER='Vardaang56',REPO='mediavault',BRANCH='main';
const categories=[
{id:'sounds',title:'Sound Effects',icon:'♫',tag:'SFX',kind:'audio',folder:'media/sounds'},
{id:'music',title:'Background Music',icon:'♬',tag:'MUSIC',kind:'audio',folder:'media/music'},
{id:'broll',title:'B-Roll Footage',icon:'▶',tag:'B-ROLL',kind:'video',folder:'media/broll'}
];
let assets=[],activeFilter='all';
const $=id=>document.getElementById(id);
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function prettyName(filename){return filename.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').replace(/\s+/g,' ').trim().replace(/\b\w/g,c=>c.toUpperCase())}
function rawUrl(path){return 'https://raw.githubusercontent.com/'+OWNER+'/'+REPO+'/'+BRANCH+'/'+path.split('/').map(encodeURIComponent).join('/')}
async function loadLibrary(){
 $('sections').innerHTML='<div class="empty">Loading the library…</div>';
 try{
  const results=await Promise.all(categories.map(async cat=>{
   const url='https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/'+cat.folder+'?ref='+BRANCH;
   const response=await fetch(url,{headers:{'Accept':'application/vnd.github+json'}});
   if(!response.ok)throw new Error('GitHub returned '+response.status+' for '+cat.title);
   const files=await response.json();
   return files.filter(f=>f.type==='file'&&!f.name.startsWith('.')&&!f.name.toLowerCase().endsWith('.md')&&!f.name.toLowerCase().endsWith('.txt')).map(f=>({id:cat.id+'/'+f.name,name:prettyName(f.name),fileName:f.name,category:cat.id,url:rawUrl(f.path),size:f.size}));
  }));
  assets=results.flat();render();
 }catch(error){$('sections').innerHTML='<div class="empty error"><strong>Could not load the library</strong>'+escapeHTML(error.message)+'<br>Try refreshing in a moment.</div>';$('total').textContent='Library unavailable'}
}
function card(a,cat){
 const media=cat.kind==='video'?'<video src="'+a.url+'" controls preload="metadata" playsinline></video>':'<div class="glyph">'+(cat.id==='music'?'♫':'♪')+'</div>';
 const player=cat.kind==='audio'?'<audio class="player" controls preload="metadata" src="'+a.url+'"></audio>':'';
 return '<article class="card"><div class="visual '+(cat.kind==='video'?'video':cat.id==='music'?'music':'')+'">'+media+'</div><div class="card-body"><div class="card-top"><h3>'+escapeHTML(a.name)+'</h3><span class="tag">'+cat.tag+'</span></div><p class="filename">'+escapeHTML(a.fileName)+'</p>'+player+'</div></article>';
}
function render(){
 const query=$('search').value.trim().toLowerCase();
 const visible=categories.filter(c=>activeFilter==='all'||c.id===activeFilter);
 let shown=0;
 $('sections').innerHTML=visible.map(cat=>{
  const items=assets.filter(a=>a.category===cat.id&&(!query||(a.name+' '+a.fileName).toLowerCase().includes(query)));
  shown+=items.length;
  return '<section class="section"><div class="section-head"><div class="section-icon">'+cat.icon+'</div><h2>'+cat.title+'</h2><span class="count">'+items.length+'</span></div><div class="grid">'+(items.length?items.map(a=>card(a,cat)).join(''):'<div class="empty"><strong>No files here yet</strong>Upload files to the '+cat.folder+' folder in the GitHub repository.</div>')+'</div></section>';
 }).join('');
 $('total').textContent=shown+' media file'+(shown===1?'':'s');
}
$('search').addEventListener('input',render);
document.querySelectorAll('[data-filter]').forEach(button=>button.addEventListener('click',()=>{
 activeFilter=button.dataset.filter;
 document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b===button));
 render();
}));
loadLibrary();
</script></body></html>
